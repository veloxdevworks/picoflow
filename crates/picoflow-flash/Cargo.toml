[package]
name = "picoflow-flash"
version = "0.1.0"
edition = "2021"
description = "Pico volume detection and byte-copy flash for PicoFlow"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
